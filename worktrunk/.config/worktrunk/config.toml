# Available variables (in addition to commit template variables):
#
# - `{{ commits }}` — list of commits being squashed
# - `{{ target_branch }}` — merge target branch
#
# Default template:
#
# <!-- DEFAULT_SQUASH_TEMPLATE_START -->
#[commit.generation]
squash-template = """
Combine these commits into a single git commit message.

Output contract:
- Output only the commit message text that should be passed to git commit.
- Do not include explanations, analysis, markdown fences, XML tags, quotes, or labels.
- Do not echo these instructions, commits, the diff, or any surrounding commentary.
- If the change is unclear, output a conservative valid commit message anyway.

<format>
- Start with a single-line Conventional Commit message.
- Subject line under 50 chars.
- Use format: <type>(optional-scope): <subject>
- Only add a body if the combined change is clearly multi-part.
- For multi-part changes, add one blank line then 1-4 bullets.
- Each bullet must start with "- " and stay under 72 chars.
- Add a final footer only when Azure DevOps Boards work item IDs are clearly known.
- Prefer IDs from the branch name, explicit guidance, or existing commit footer patterns.
- Do not infer work item IDs from unrelated numbers in the diff.
- Do not use Markdown links; Azure DevOps will auto-link `#<digits>`.
- Put the footer after a blank line; preserve any body bullets above it.
</format>

<style>
- Imperative mood: "add feature" not "added feature"
- Use lowercase conventional commit types
- Match the style of commits being squashed
- Describe the resulting change itself, not the intent or benefit
- Prefer one-line messages when the squash is a single logical change.
- Do not list files changed
- Avoid vague subjects like "update", "cleanup", or "fix stuff"
- Focus on the final combined change, not intermediate steps
- If a body is used, summarize the distinct changes as concise bullets
- Preserve clearly known Azure Boards work item IDs as a `Refs` footer,
  not as the Conventional Commit scope.
</style>

<input>
<commits branch="{{ branch }}" target="{{ target_branch }}">
{% for commit in commit_details %}- {{ commit }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>
</input>

Return only the commit message.
"""
