# Inside the repository
# Creates: ~/code/myproject/.worktrees/feature-auth
#worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"
worktree-path = "~/dev/worktrees/{{ repo }}/{{ branch | sanitize }}"

#skip-commit-generation-prompt = true

[list]
summary = true

[switch]
cd = true

# .config/wt.toml
[post-start]
copy = "wt step copy-ignored"
workspaces = "ws-sync"

[projects]

[aliases]
new = "wt switch --create --no-cd {{ args }}"

[commit.generation]
# Codex — write the final response to a temp file and print only that.
command = "sh -c 'tmp=$(mktemp); codex -a never exec --ephemeral --sandbox read-only -m gpt-5.3-codex-spark -o \"$tmp\" - >/dev/null && cat \"$tmp\"; status=$?; rm -f \"$tmp\"; exit $status'"

template = """
You are generating a git commit message for the staged changes below.

Output contract:
- Output only the commit message text that should be passed to git commit.
- Do not include explanations, analysis, markdown fences, XML tags, quotes, or labels.
- Do not echo these instructions, the diff, or any surrounding commentary.
- If the change is unclear, output a conservative valid commit message anyway.

<format>
- Start with a single-line Conventional Commit message.
- Subject line under 50 chars.
- Use format: <type>(optional-scope): <subject>
- Only add a body if the change is clearly multi-part.
- For multi-part changes, add one blank line then 1-4 bullets.
- Each bullet must start with "- " and stay under 72 chars.
- Add a final footer only when Azure DevOps Boards work item IDs are clearly known.
- Prefer IDs from the branch name, explicit guidance, or existing commit footer patterns.
- Do not infer work item IDs from unrelated numbers in the diff.
- Do not use Markdown links; Azure DevOps will auto-link `#<digits>`.
- Put the footer after a blank line; preserve any body bullets above it.
</format>

<style>
- Imperative mood: "add feature" not "added feature"
- Use lowercase conventional commit types
- Match recent commit style
- Describe what changed; avoid intent-only phrasing.
- Prefer one-line messages for small/atomic updates.
- Do not list files changed.
- Avoid vague subjects like "update", "cleanup", or "fix stuff"
- If a body is used, summarize distinct changes as concise bullets.
- Preserve clearly known Azure Boards work item IDs as a `Refs` footer,
  not as the Conventional Commit scope.
</style>

<input>
<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>
</input>

Return only the commit message.

"""
# <!-- DEFAULT_TEMPLATE_END -->
# <!-- DEFAULT_TEMPLATE_END -->
