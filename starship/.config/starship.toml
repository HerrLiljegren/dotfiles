"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "catppuccin_mocha"
format = """
[╭─](blue)$username$hostname$directory$git_branch$git_status$dotnet$docker_context
[╰─](blue)$character
"""
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[V](bold lavender)"
[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold blue"
format = "[ $path]($style) "
[username]
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style)"
disabled = false
show_always = true
aliases = { "corpuser034g" = "matchai" }
[hostname]
ssh_only = true
trim_at = ".companyname.com"
format = "[@$hostname](overlay1)"
disabled = false
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "
[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
[dotnet]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "
detect_extensions = ["sln", "csproj", "fsproj", "xproj"]
detect_files = ["global.json", "Directory.Build.props"]
[docker_context]
symbol = " "
style = "overlay1"
format = "[$symbol$context]($style) "
only_with_files = true
