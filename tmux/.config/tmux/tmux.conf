# Add this to handle the "garbage" (Device Attributes) correctly
#set -s escape-time 10
set -g escape-time 500
set -g focus-events off

# Force tmux to recognize the terminal capabilities
#set -g default-terminal "tmux-256color"

#set -as terminal-features ",xterm-ghostty:RGB,hyperlinks,clipboard"
#set -as terminal-features ",ghostty:RGB,hyperlinks,clipboard"
#set -as terminal-features ",*:hyperlinks"

# Basic settings
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g status-keys vi

# Set window titles to "session:window" and enable automatic renaming
set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_name}"
set -g automatic-rename on

# Vim-like copy-mode (use v/V/y like in nvim)
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line
bind-key -T copy-mode-vi Escape send-keys -X cancel

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

bind R source-file ~/.config/tmux/tmux.conf \; display 'Config Reloaded!'

# Split windows
unbind %
unbind '"'
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


# Vim-syle pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+arrows to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alt+number to jump to windows without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Simple Catppuccin Mocha status bar
# These @ctp_* options are just named colors. Later, #{@ctp_blue} means
# "insert the value stored in @ctp_blue here".
set -g @ctp_blue '#89b4fa'
set -g @ctp_pink '#f5c2e7'
set -g @ctp_text '#cdd6f4'
set -g @ctp_subtext1 '#bac2de'
set -g @ctp_overlay0 '#6c7086'
set -g @ctp_overlay1 '#7f849c'
set -g @ctp_surface1 '#45475a'
set -g @ctp_green '#a6e3a1'
set -g @ctp_peach '#fab387'
set -g @ctp_mantle '#181825'
set -g @ctp_crust '#11111b'

# Pane borders
set -g pane-border-style "fg=#{@ctp_surface1}"
set -g pane-active-border-style "fg=#{@ctp_peach}"

# Bar placement and base colors.
set -g status-position top
set -g status-style "bg=#{@ctp_mantle},fg=#{@ctp_text}"
set -g status-right-length 100
set -g status-left-length 50
set -g window-status-separator ""

# Left side of the bar: current session name (#S) in a pill.
set -g status-left "#[fg=#{@ctp_blue},bg=#{@ctp_mantle}]#[fg=#{@ctp_crust},bg=#{@ctp_blue},bold] #S #[fg=#{@ctp_blue},bg=#{@ctp_mantle}] #[fg=#{@ctp_overlay0},bg=#{@ctp_mantle}]"

# Inactive windows: #I is the window number, #W is the window name.
set -g window-status-format "#[fg=#{@ctp_surface1},bg=#{@ctp_mantle}]#[fg=#{@ctp_subtext1},bg=#{@ctp_surface1}] #I:#W #[fg=#{@ctp_surface1},bg=#{@ctp_mantle}] "

# Active window: same shape, brighter fill so it stands out.
set -g window-status-current-format "#[fg=#{@ctp_pink},bg=#{@ctp_mantle}]#[fg=#{@ctp_crust},bg=#{@ctp_pink},bold] #I:#W #[fg=#{@ctp_pink},bg=#{@ctp_mantle}] "

# Right side: prefix state, current path, and time.
set -g status-right "#[fg=#{@ctp_peach},bg=#{@ctp_mantle},bold]#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,🔍 ZOOM ,}#[fg=#{@ctp_surface1},bg=#{@ctp_mantle}]#[fg=#{@ctp_text},bg=#{@ctp_surface1}] #{=/40/...:pane_current_path} #[fg=#{@ctp_surface1},bg=#{@ctp_mantle}] #[fg=#{@ctp_green},bg=#{@ctp_mantle}]#[fg=#{@ctp_crust},bg=#{@ctp_green},bold] %H:%M #[fg=#{@ctp_green},bg=#{@ctp_mantle}]"

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
