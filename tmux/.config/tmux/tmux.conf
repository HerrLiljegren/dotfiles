# ~/.tmux.conf

# ─── Better prefix ───────────────────────────────────────
# Ctrl+a is easier to reach than Ctrl+b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── General settings ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -g mouse on
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # renumber when closing
set -g escape-time 0           # no delay on Esc
set -g focus-events on

# ─── Splits (intuitive keys) ────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (vim-style) ────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation (like Niri/i3 workspaces) ────────
# Alt+number to jump directly (no prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+h/l to go prev/next window (no prefix needed)
bind -n M-h previous-window
bind -n M-l next-window

# ─── Consume/Expel (Niri-style) ─────────────────────────
# Alt+] = consume next window as a pane (horizontal split)
# Alt+[ = expel current pane back to its own window
bind -n M-] join-pane -h -s :+1
bind -n M-[ break-pane

# ─── Quick reload ────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─── Status bar (clean & minimal) ────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=default] "

# Right: date & time
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8] %a %d %b #[fg=#89b4fa,bold] %H:%M "

# Window tabs
setw -g window-status-format "#[fg=#6c7086]  #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold]  #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Messages
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"
