# Keep worktrees inside their repository so the configuration is portable.
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[list]
summary = true

[switch]
cd = true

[aliases]
new = "wt switch --create --no-cd {{ args }}"

[commit.generation]
# Codex — write the final response to a temp file and print only that.
command = "sh -c 'tmp=$(mktemp); codex -a never exec --ephemeral --sandbox read-only -m gpt-5.6-luna -c model_reasoning_effort=low -o \"$tmp\" - >/dev/null && cat \"$tmp\"; status=$?; rm -f \"$tmp\"; exit $status'"

template = """
Write a Conventional Commit message for this staged diff.

Start with `type: description` or `type(scope): description` (add `!` before
`:` only for a breaking change). Use one of: build, chore, ci, docs, feat, fix,
perf, refactor, revert, style, or test. Keep the header under 72 characters and
use a concise, lowercase, imperative description with no final period.

For a simple change, output only the header. Add a body only when it provides
important context that the header cannot capture. Separate it with a blank line
and use a short paragraph or 1-3 concise bullets, with lines under 72 characters.
Do not repeat the header or list files. Output only the commit message.

{{ git_diff }}
"""

squash-template = """
Write a Conventional Commit message for the final squashed change.

Start with `type: description` or `type(scope): description` (add `!` before
`:` only for a breaking change). Use one of: build, chore, ci, docs, feat, fix,
perf, refactor, revert, style, or test. Keep the header under 72 characters and
use a concise, lowercase, imperative description with no final period.

For a simple change, output only the header. Add a body only when it provides
important context that the header cannot capture. Separate it with a blank line
and use a short paragraph or 1-3 concise bullets, with lines under 72 characters.
Describe the final result rather than intermediate commits. Do not repeat the
header or list files. Output only the commit message.

Commits:
{% for commit in commit_details %}- {{ commit }}
{% endfor %}

Diff:
{{ git_diff }}
"""
