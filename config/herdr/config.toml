onboarding = false

[experimental]
pane_history = true
kitty_graphics = true

[keys]
# Prefix
prefix = "ctrl+space"

# Panes
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
zoom = "prefix+z"
copy_mode = "prefix+["

# Tabs
new_tab = "prefix+c"
rename_tab = "prefix+comma"
switch_tab = "alt+1..9"

# Herdr
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+shift+o"

# Workspace history
[[keys.command]]
key = "prefix+shift+L"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

# File viewing — Herdr File Viewer
[[keys.command]]              # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# Pane navigation — Herdr Splits
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate left (Nvim / Herdr)"

[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate left (Nvim / Herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate down (Nvim / Herdr)"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate down (Nvim / Herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate up (Nvim / Herdr)"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate up (Nvim / Herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate right (Nvim / Herdr)"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate right (Nvim / Herdr)"

# Pane resizing — Herdr Splits
[[keys.command]]
key = "alt+shift+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize left (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize down (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize up (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right (Nvim / Herdr)"

[[keys.command]]
key = "alt+shift+right"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize right (Nvim / Herdr)"

# Worktrees — Worktrunk
# Override Herdr's built-in "new worktree" key (prefix+shift+g) with Worktrunk's
# switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[ui]
right_click_passthrough_modifier = "ctrl"
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "top-right"
